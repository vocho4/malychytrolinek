name: Supabase keepalive
# Jednou za pár dní pošle projektu dojo jednoduchý dotaz, aby ho Supabase nepozastavil pro neaktivitu.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dotaz na tabulku attempts
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' dojo/config.js)
          KEY=$(grep -oP 'supabaseKey:\s*"\K[^"]+' dojo/config.js)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/attempts?select=ts&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase odpověděl: $CODE"
          test "$CODE" = "200"
