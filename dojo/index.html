<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dojo do Japonska</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: jeden sloupec jako mobilní aplikace, velké dotykové plochy, kana jako hlavní grafický prvek. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#141a35; --muted:#5b6385; --line:#d5d9e8;
  --soft:#e3e7f6; --accent:#2a3fa8; --on-accent:#ffffff; --gold:#e9a800;
  --good:#1b7f55; --good-bg:#dff3e9; --bad:#b5301f; --bad-bg:#fbe4e0;
  --f-display:"Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;
  --f-body:"Nunito Sans","Zen Maru Gothic",system-ui,sans-serif;
  --f-kana:"Dela Gothic One","Zen Maru Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#171d45; --ink:#eef0ff; --muted:#9aa3d0; --line:#2a3166;
  --soft:#1f2655; --accent:#f2b705; --on-accent:#141a35; --gold:#f2b705;
  --good:#4fd39a; --good-bg:#12382d; --bad:#ff8a7d; --bad-bg:#43211f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#171d45; --ink:#eef0ff; --muted:#9aa3d0; --line:#2a3166;
  --soft:#1f2655; --accent:#f2b705; --on-accent:#141a35; --gold:#f2b705;
  --good:#4fd39a; --good-bg:#12382d; --bad:#ff8a7d; --bad-bg:#43211f; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.25rem;font-weight:800} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;display:flex;align-items:center;gap:10px}
.brand .mark{font-family:var(--f-kana);font-size:1.5rem;color:var(--accent)}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 8px}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.today{background:var(--accent);color:var(--on-accent);border:0}
.today .eyebrow{color:inherit;opacity:.8}
.today .btn{background:var(--on-accent);color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--soft);min-height:48px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.item[disabled]{opacity:.55;cursor:default}
.badge{font-family:var(--f-kana);font-size:1.3rem;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.item .t span{color:var(--muted);font-size:.85rem}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.hook{background:var(--soft);border-radius:12px;padding:14px 16px;font-weight:600}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.v{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.v .t{font-family:var(--f-kana);font-size:1.8rem;line-height:1.2;overflow-wrap:anywhere}
.v .t.latin{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.v .r{font-weight:700;color:var(--accent)}
.v .c{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.big{font-family:var(--f-kana);font-size:clamp(3rem,18vw,5.5rem);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.q{font-family:var(--f-display);font-size:1.35rem;font-weight:600;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:700;text-align:left;min-height:56px;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
input[type=text]{font:inherit;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:4rem;text-align:center;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:.9rem}
.kids{display:grid;gap:12px}
.kidbtn{display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left}
.kidbtn .avatar{width:56px;height:56px;font-size:1.6rem}
.kidbtn b{font-family:var(--f-display);font-size:1.5rem}
/* Hra: celoobrazovková běhačka, na výšku, ovládání klepnutím. */
.game{--surface:#fbf8f0;--ink:#151515;--muted:#5d5a52;--line:#cfc9bb;--soft:#ece6d6;--accent:#c8281e;--on-accent:#fff;--good:#1b7f55;--good-bg:#dff3e9;--bad:#b5301f;--bad-bg:#fbe4e0;color-scheme:light;position:fixed;inset:0;z-index:10;background:#151515;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.game .stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden}
.game canvas{display:block;width:100%;height:100%}
.game .hud{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.game .hud>*{pointer-events:auto}
.game .hbtn{background:#fbf8f0;color:#151515;box-shadow:0 0 0 2px #151515;border:0;border-radius:999px;padding:8px 14px;font-weight:700;min-height:40px}
.game .hpill{background:#151515;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.game .hint{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-weight:700;pointer-events:none;transition:opacity .4s}
.game .ov{position:absolute;inset:0;background:rgba(21,21,21,.55);display:flex;align-items:flex-end;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.game .ov .card{width:100%;color:var(--ink)}
.game .ov .opts{grid-template-columns:1fr}
.game .scroll-card{background:var(--surface);border:0;border-radius:6px;border-top:12px solid #151515;border-bottom:12px solid #151515;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.game .scroll-card .opt{border-color:#151515}
.game .sign{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--soft);border-radius:14px;padding:16px}
.game .sign{border:0;color:var(--ink);font:inherit;cursor:pointer}
.game .pict{display:flex}
.game .sign b{font-family:"Zen Maru Gothic",var(--f-kana);font-size:clamp(2.6rem,14vw,4rem);font-weight:700;line-height:1}
.game .sign span{display:block;color:var(--accent);font-weight:700;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="config.js"></script>
<script>
'use strict';
const CFG = window.DOJO_CONFIG || {};
const KIDS = ['Matěj','Jáchym','Nikola','Vláďa'];
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const state = {kid:LS.get('dojo.kid',null), lessons:[], remote:[], loaded:false, sync:'local', tab:'lessons', error:null};
const app = document.getElementById('app');

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k==='class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v===true) e.setAttribute(k,'');
    else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function mount(...nodes){ app.replaceChildren(...nodes.flat().filter(Boolean)); window.scrollTo(0,0); }
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.,!?'’"]/g,'').replace(/\s+/g,' ').trim();
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const fmtDate = ts => new Date(ts).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
function say(text, lang){
  try{ if(!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(text); u.lang=lang||'en-US'; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
}

/* ---------- úložiště výsledků ---------- */
const remote = {
  on:()=>!!(CFG.supabaseUrl && CFG.supabaseKey),
  hd(){return {apikey:CFG.supabaseKey, Authorization:'Bearer '+CFG.supabaseKey, 'Content-Type':'application/json'};},
  async list(){
    const r = await fetch(CFG.supabaseUrl+'/rest/v1/attempts?select=kid,lesson_id,score,total,ts&order=ts.desc&limit=5000',{headers:this.hd()});
    if(!r.ok) throw new Error(r.status); return r.json();
  },
  async add(rows){
    const r = await fetch(CFG.supabaseUrl+'/rest/v1/attempts',{method:'POST',headers:{...this.hd(),Prefer:'return=minimal'},body:JSON.stringify(rows)});
    if(!r.ok) throw new Error(r.status);
  }
};
const pending = () => LS.get('dojo.pending',[]);
const attempts = () => [...state.remote, ...pending()];

function perKid(kid){
  const mine = attempts().filter(a=>a.kid===kid);
  const best = {};
  for (const a of mine){ const p=a.total?a.score/a.total:0; const b=best[a.lesson_id]; if(!b||p>b.p) best[a.lesson_id]={p,score:a.score,total:a.total}; }
  let xp = 0;
  for (const l of state.lessons){ const b=best[l.id]; if(b) xp += Math.round((l.xp||30)*b.p); }
  const days = new Set(mine.map(a=>ymd(new Date(a.ts))));
  let streak = 0; const d = new Date();
  if(!days.has(ymd(d))) d.setDate(d.getDate()-1);
  while(days.has(ymd(d))){ streak++; d.setDate(d.getDate()-1); }
  const last = mine.reduce((m,a)=>a.ts>m?a.ts:m,'');
  return {mine,best,xp,streak,done:Object.keys(best).length,last};
}

/* ---------- načtení ---------- */
async function load(){
  render();
  try{
    const idx = await (await fetch('lessons/index.json?v='+Date.now())).json();
    const ls = await Promise.all(idx.map(f=>fetch('lessons/'+f+'?v='+Date.now()).then(r=>r.json())));
    state.lessons = ls.sort((a,b)=>(!!a.bonus-!!b.bonus)||a.day-b.day);
  }catch(e){ state.error='lessons'; }
  if (remote.on()){
    try{
      const p = pending();
      if(p.length){ await remote.add(p); LS.set('dojo.pending',[]); }
      state.remote = await remote.list(); state.sync='ok';
    }catch(e){ state.sync='err'; }
  }
  state.loaded = true; render();
}

/* ---------- obrazovky ---------- */
function render(){
  if(!state.kid) return pickKid();
  home();
}
function pickKid(){
  mount(
    h('div',{class:'brand'},h("span",{class:"mark"},"あ"),'Dojo do Japonska'),
    h('h1',{},'Kdo dnes cvičí?'),
    h('div',{class:'kids'}, KIDS.map(k=>h('button',{class:'kidbtn',onclick:()=>{state.kid=k;LS.set('dojo.kid',k);render();}},
      h('span',{class:'avatar'},k[0]), h('b',{},k))))
  );
}
function topbar(){
  return h('div',{class:'top'},
    h('div',{class:'brand'},h("span",{class:"mark"},"あ"),'Dojo'),
    h('div',{class:'chip'},h('span',{class:'avatar'},state.kid[0]),h('b',{},state.kid),
      h('button',{class:'link',onclick:()=>{state.kid=null;LS.set('dojo.kid',null);render();}},'změnit')));
}
function home(){
  const s = perKid(state.kid);
  const nodes = [topbar()];
  nodes.push(h('div',{class:'tabs',role:'tablist'}, [['lessons','Lekce'],['history','Historie']].map(([k,t])=>
    h('button',{role:'tab','aria-selected':String(state.tab===k),onclick:()=>{state.tab=k;render();}},t))));
  nodes.push(h('div',{class:'stats'},
    h('div',{class:'stat'},h('b',{},s.streak),h('span',{},'dní v řadě')),
    h('div',{class:'stat'},h('b',{},s.xp),h('span',{},'bodů XP')),
    h('div',{class:'stat'},h('b',{},s.done+'/'+state.lessons.length),h('span',{},'lekcí hotovo'))));
  if(!state.loaded) nodes.push(h('p',{class:'note'},'Načítám lekce…'));
  else if(state.error) nodes.push(h('div',{class:'card'},h('h2',{},'Lekce se nenačetly'),h('p',{},'Zkus stránku obnovit. Když to nepomůže, napiš tátovi.')));
  else if(!state.lessons.length) nodes.push(h('div',{class:'card'},h('h2',{},'Zatím tu nejsou žádné lekce'),h('p',{},'První se objeví, jakmile je táta nahraje.')));
  else if(state.tab==='lessons') nodes.push(lessonList(s));
  else nodes.push(...historyView(s));
  if(state.sync==='err') nodes.push(h('p',{class:'note'},'Výsledky se zatím neposlaly na server. Jsou uložené v tomto zařízení a odešlou se příště.'));
  if(!remote.on()) nodes.push(h('p',{class:'note'},'Výsledky se ukládají jen v tomto zařízení.'));
  mount(nodes);
}
const lbl = l => l.bonus ? 'Bonus · japonština' : 'Angličtina · lekce '+l.day;
function unlocked(l){ return l.date<=today(); }
function todayView(s){
  const open = state.lessons.filter(unlocked);
  const cur = open.length ? open[open.length-1] : null;
  const out = [];
  if(!cur){ out.push(h('div',{class:'card'},h('h2',{},'Ještě nezačínáme'),h('p',{},'První lekce se odemkne '+state.lessons[0].date+'.'))); return out; }
  const b = s.best[cur.id];
  out.push(h('div',{class:'card today'},
    h('span',{class:'eyebrow'},(cur.lang==='ja'?'Japonština':'Angličtina')+' · lekce '+cur.day),
    h('h1',{},cur.title),
    h('p',{},cur.hook||''),
    h('div',{class:'row'},
      h('button',{class:'btn',onclick:()=>startLesson(cur)},b?'Zopakovat':'Začít lekci'),
      b?h('span',{},'Nejlepší výsledek: '+b.score+'/'+b.total):null)));
  const missed = open.slice(0,-1).filter(l=>!s.best[l.id]);
  if(missed.length) out.push(h('div',{class:'card'},h('h2',{},'Nestihnuté lekce'),
    h('div',{class:'list'},missed.map(l=>lessonItem(l,s)))));
  return out;
}
function lessonItem(l,s){
  const ok = unlocked(l); const b = s.best[l.id];
  return h('button',{class:'item',disabled:!ok,onclick:()=>ok&&startLesson(l)},
    h('span',{class:'badge'},l.lang==='ja'?'あ':'Aa'),
    h('span',{class:'t'},h('b',{},l.title),h('span',{},ok?lbl(l):'Odemkne se '+l.date)),
    b?h('span',{class:'pill good'},b.score+'/'+b.total):h('span',{class:'pill'},ok?'nová':'zamčeno'));
}
function lessonList(s){
  const main = state.lessons.filter(l=>!l.bonus), bonus = state.lessons.filter(l=>l.bonus);
  const next = main.find(l=>unlocked(l)&&!s.best[l.id]);
  return h('div',{class:'wrap'},
    next?h('div',{class:'card today'},h('span',{class:'eyebrow'},'Další lekce'),h('h2',{},next.title),h('p',{},next.hook||''),
      h('button',{class:'btn',onclick:()=>startLesson(next)},'Začít')):null,
    h('div',{class:'list'},main.map(l=>lessonItem(l,s))),
    bonus.length?h('h2',{},'Bonus: japonské znaky'):null,
    bonus.length?h('p',{class:'note'},'Až budeš chtít něco navíc. Anglická lekce je důležitější.'):null,
    bonus.length?h('div',{class:'list'},bonus.map(l=>lessonItem(l,s))):null);
}
function historyView(s){
  const title = id => (state.lessons.find(l=>l.id===id)||{title:id}).title;
  const rows = s.mine.slice().sort((a,b)=>a.ts<b.ts?1:-1).slice(0,30);
  const mine = h('div',{class:'card'},h('h2',{},'Moje pokusy'),
    rows.length?h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Kdy'),h('th',{},'Lekce'),h('th',{},'Body'))),
      h('tbody',{},rows.map(a=>h('tr',{},h('td',{},fmtDate(a.ts)),h('td',{},title(a.lesson_id)),h('td',{},a.score+'/'+a.total)))))):h('p',{class:'note'},'Zatím žádný pokus.'));
  const fam = h('div',{class:'card'},h('h2',{},'Přehled všech'),h('div',{class:'scroll'},h('table',{},
    h('thead',{},h('tr',{},h('th',{},'Kdo'),h('th',{},'Hotovo'),h('th',{},'XP'),h('th',{},'Série'))),
    h('tbody',{},KIDS.map(k=>{const p=perKid(k);return h('tr',{},h('td',{},k),h('td',{},p.done+'/'+state.lessons.length),h('td',{},p.xp),h('td',{},p.streak));})))));
  return [mine,fam];
}

/* ---------- lekce ---------- */
let run = null;
function startLesson(l){ run={l,i:-1,correct:0}; intro(); }
function intro(){
  const l = run.l;
  mount(
    h('div',{class:'top'},h('button',{class:'link',onclick:render},'← Zpět')),
    h('span',{class:'eyebrow'},lbl(l)),
    h('h1',{},l.title),
    l.hook?h('p',{class:'hook'},l.hook):null,
    ...String(l.intro||'').split('\n\n').map(p=>h('p',{},p)),
    (l.vocab&&l.vocab.length)?h('div',{class:'vocab'},l.vocab.map(v=>h('button',{class:'v',onclick:()=>say(v.s||v.t,v.lang)},
      h('span',{class:'t'+(l.lang==='ja'?'':' latin')},v.t),v.r?h('span',{class:'r'},v.r):null,h('span',{class:'c'},v.c)))):null,
    (l.vocab&&l.vocab.length)?h('p',{class:'note'},'Klepnutím na kartu si poslechneš výslovnost (pokud ji zařízení umí).'):null,
    h('button',{class:'btn primary',onclick:()=>{run.i=0;exercise();}},'Začít cvičení')
  );
}
function exercise(){
  const l=run.l, ex=l.exercises[run.i], n=l.exercises.length;
  const fb = h('div',{class:'fb',hidden:true});
  const next = h('button',{class:'btn primary',hidden:true,onclick:()=>{run.i++; run.i>=n?finish():exercise();}},run.i===n-1?'Dokončit':'Pokračovat');
  const check = h('button',{class:'btn primary',disabled:true},'Zkontrolovat');
  const done = (ok,msg)=>{
    run.correct += ok?1:0; fb.className='fb '+(ok?'good':'bad'); fb.hidden=false;
    fb.replaceChildren(h('strong',{},ok?'Správně. ':'Špatně. '),msg||''); next.hidden=false; check.hidden=true; next.focus();
  };
  if(ex.t==='run'){ return runUI(ex,(ok)=>{ run.correct+=ok; run.i++; run.i>=n?finish():exercise(); }); }
  let body;
  if(ex.t==='choice') body=choiceUI(ex,check,done);
  else if(ex.t==='type') body=typeUI(ex,check,done);
  else body=matchUI(ex,check,done);
  mount(
    h('div',{class:'top'},h('button',{class:'link',onclick:render},'Ukončit'),h('span',{class:'note'},(run.i+1)+' / '+n)),
    h('div',{class:'bar'},h('i',{style:'width:'+Math.round(run.i/n*100)+'%'})),
    ex.big?h('div',{class:'big'},ex.big):null,
    h('p',{class:'q'},ex.q),
    body, fb, check, next
  );
}
function choiceUI(ex,check,done){
  const opts = shuffle(ex.o.map((t,i)=>({t,i})));
  let sel = null; const btns = [];
  const box = h('div',{class:'opts'}, opts.map(o=>{
    const b = h('button',{class:'opt','aria-pressed':'false',onclick:()=>{ if(check.hidden) return; sel=o; btns.forEach(x=>x.setAttribute('aria-pressed',String(x===b))); check.disabled=false; }},o.t);
    btns.push(b); return b;
  }));
  check.onclick = ()=>{
    const ok = sel.i===ex.a; check.hidden=true;
    btns.forEach((b,idx)=>{ b.disabled=true; if(opts[idx].i===ex.a) b.classList.add('good'); else if(opts[idx]===sel) b.classList.add('bad'); });
    done(ok, ok?(ex.e||''):('Správně: '+ex.o[ex.a]+'. '+(ex.e||'')));
  };
  return box;
}
function typeUI(ex,check,done){
  const inp = h('input',{type:'text',id:'ans','aria-label':'Odpověď',autocomplete:'off',autocapitalize:'none',spellcheck:'false'});
  inp.addEventListener('input',()=>{check.disabled=!inp.value.trim();});
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!check.disabled&&!check.hidden) check.click(); });
  check.onclick = ()=>{
    const ok = ex.a.some(a=>norm(a)===norm(inp.value)); inp.disabled=true;
    done(ok, ok?(ex.e||''):('Správně: '+ex.a[0]+'. '+(ex.e||'')));
  };
  setTimeout(()=>inp.focus(),50);
  return inp;
}
function matchUI(ex,check,done){
  check.hidden = true;
  const L = shuffle(ex.p.map((p,i)=>({t:p[0],i}))), R = shuffle(ex.p.map((p,i)=>({t:p[1],i})));
  let sl=null, sr=null, ok=new Set(), mistakes=0;
  const bl=[], br=[];
  const refresh=()=>{
    bl.forEach((b,k)=>{ b.setAttribute('aria-pressed',String(sl===L[k])); b.disabled=ok.has(L[k].i); if(ok.has(L[k].i)) b.classList.add('good'); });
    br.forEach((b,k)=>{ b.setAttribute('aria-pressed',String(sr===R[k])); b.disabled=ok.has(R[k].i); if(ok.has(R[k].i)) b.classList.add('good'); });
  };
  const test=()=>{
    if(!sl||!sr) return;
    if(sl.i===sr.i){ ok.add(sl.i); sl=sr=null; refresh();
      if(ok.size===ex.p.length) done(mistakes===0, mistakes===0?'Bez chyby.':'Chyb: '+mistakes+'.'+(ex.e?' '+ex.e:'')); }
    else { mistakes++; const a=sl,b=sr; sl=sr=null; refresh();
      const ia=L.indexOf(a), ib=R.indexOf(b); bl[ia].classList.add('bad'); br[ib].classList.add('bad');
      setTimeout(()=>{bl[ia].classList.remove('bad');br[ib].classList.remove('bad');},450); }
  };
  const col=(arr,btns,set)=>h('div',{class:'col'},arr.map((o,k)=>{ const b=h('button',{class:'opt','aria-pressed':'false',onclick:()=>{set(o);refresh();test();}},o.t); btns.push(b); return b; }));
  return h('div',{class:'match'},col(L,bl,o=>{sl=o;}),col(R,br,o=>{sr=o;}));
}
/* ---------- hra: běhačka s otázkami (styl tuš + červený javor) ---------- */
const SAM={img:new Image(), w:182/239}; SAM.img.src='img/samurai.png';
function runUI(ex, onDone){
  const cv = h('canvas',{'aria-label':'Hra: malý samuraj běží sám, klepnutím skáče'});
  const ctx = cv.getContext('2d');
  const qLbl = h('span',{class:'hpill'},'Otázka 1/'+ex.qs.length);
  const cnt = h('span',{class:'hpill'},'○○○');
  const hint = h('div',{class:'hint'},'Klepni kamkoli = skok');
  const quit = ()=>{ stop(); render(); };
  const stage = h('div',{class:'stage'}, cv,
    h('div',{class:'hud'}, h('button',{class:'hbtn',onclick:quit},'Ukončit'), qLbl, cnt), hint);
  const root = h('div',{class:'game'}, stage);
  mount(root); document.body.style.overflow='hidden';

  const INK='#151515', RED='#c8281e', PAPER='#efece4';
  let W=0,H=0,G=0,S=0,B=0, alive=true, paused=false, last=0, raf=0;
  let speed=0, jumpV=0, grav=0, dist=0, T=0;
  const P = {y:0, vy:0, kick:0, air:false};
  let obs=[], passed=0, qi=0, firstTry=0, bubble=null, jumped=false, nextGap=0;
  let leaves=[], bgC=null, grC=null, birds=[];
  function size(){
    const r = stage.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, 2);
    W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    G = H*.84; S = Math.min(H*.36, W*.8); B = Math.min(H*.2, W*.42);
    grav = S*14; jumpV = Math.sqrt(2*grav*S*.65); speed = S*1.3;
    if(!P.air) P.y=G;
    leaves = Array.from({length:10},()=>newLeaf(true)); bgC=null;
  }
  function newLeaf(anywhere){ return {x:Math.random()*W, y:anywhere?Math.random()*H:-20, vx:-B*(.2+Math.random()*.4), vy:B*(.25+Math.random()*.35), r:Math.random()*6, vr:(Math.random()-.5)*3, s:B*(.05+Math.random()*.05), g:0}; }
  size(); window.addEventListener('resize', size);
  nextGap = S*2.5;
  const px = ()=>S*.3;

  function jump(){ if(paused||!alive) return; if(!P.air){ P.vy=-jumpV; P.air=true; } if(!jumped){ jumped=true; hint.style.opacity=0; } }
  stage.addEventListener('pointerdown', e=>{ if(e.target.closest('button,.ov')) return; e.preventDefault(); jump(); });
  const key = e=>{ if(e.code==='Space'||e.key==='ArrowUp'){ e.preventDefault(); jump(); } };
  window.addEventListener('keydown', key);
  function stop(){ alive=false; cancelAnimationFrame(raf); window.removeEventListener('resize',size); window.removeEventListener('keydown',key); document.body.style.overflow=''; }

  const KINDS = {
    case:{w:.8,h:.72,monster:false}, poop:{w:.62,h:.5,monster:false},
    blob:{w:.75,h:.6,monster:true},  ball:{w:.62,h:.62,monster:true},
    tnt:{w:.62,h:.66,monster:false}, sushi:{w:.78,h:.42,monster:false}, buddha:{w:.6,h:.72,monster:false},
    apple:{w:.55,h:.58,monster:false}, bowl:{w:.8,h:.5,monster:false},
    oni:{w:.7,h:.8,monster:true}, chomp:{w:.66,h:.66,monster:true}, robot:{w:.6,h:.78,monster:true}
  };
  const KLIST=['case','poop','blob','ball','tnt','sushi','buddha','apple','bowl','oni','chomp','robot'];
  function spawn(){
    const k = KLIST[Math.floor(Math.random()*KLIST.length)], K=KINDS[k];
    obs.push({k, x:W+S, w:S*K.w*.5, h:S*K.h*.5, m:K.monster, ph:Math.random()*6, lift:0});
    nextGap = S*(2.3+Math.random()*1.2);
  }
  function burst(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=B*(1.5+Math.random()*2.5);
    leaves.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-B*1.5,r:Math.random()*6,vr:(Math.random()-.5)*12,s:B*(.05+Math.random()*.05),g:1,life:1.6}); } }
  function update(dt){
    T+=dt; dist += speed*dt;
    if(P.air){ P.vy += grav*dt; P.y += P.vy*dt; if(P.y>=G){ P.y=G; P.vy=0; P.air=false; } }
    if(P.kick>0) P.kick-=dt;
    const lastO = obs[obs.length-1];
    if(!lastO || lastO.x < W+S-nextGap) spawn();
    const pw=S*.21, pl=px()-pw/2, pr=px()+pw/2, ptop=P.y-S*.5;
    for(const o of obs){
      if(o.fly){ o.x+=o.vx*dt; o.y+=o.vy*dt; o.vy+=grav*.5*dt; o.rot+=dt*14; continue; }
      o.x -= speed*dt;
      o.lift = o.k==='ball' ? Math.abs(Math.sin(T*4+o.ph))*S*.18 : 0;
      const ol=o.x-o.w/2+o.w*.18, or=o.x+o.w/2-o.w*.18, obot=G-o.lift, otop=obot-o.h*.85;
      if(!o.hit && or>pl && ol<pr && P.y>otop && ptop<obot){
        o.hit=true;
        if(o.m){ o.fly=true; o.y=obot-o.h/2; o.vx=speed*1.8; o.vy=-S*7; o.rot=0; P.kick=.35; burst(o.x,o.y,14);
          bubble={t:'Padej vorle!', until:performance.now()+1300}; }
        else { P.vy=-jumpV*.9; P.air=true; bubble={t:o.k==='poop'?'Fuj!':'Au!', until:performance.now()+800}; }
      }
      if(!o.done && (o.fly || o.x+o.w/2 < pl)){ o.done=true; passed++; cnt.textContent='●'.repeat(passed)+'○'.repeat(3-passed); if(passed>=3) setTimeout(ask,250); }
    }
    obs = obs.filter(o=>o.x>-S*2 && o.x<W*3 && (!o.fly || o.y<H+S*2));
    for(const l of leaves){ l.x+=l.vx*dt - (l.g?0:speed*.15*dt); l.y+=l.vy*dt; l.r+=l.vr*dt;
      if(l.g){ l.vy+=grav*.35*dt; l.vx*=.99; l.life-=dt; } else { l.x+=Math.sin(T*2+l.r)*S*.3*dt; } }
    leaves = leaves.filter(l=> l.g ? l.life>0 : (l.y<H && l.x>-30));
    while(leaves.filter(l=>!l.g).length<10) leaves.push(newLeaf(false));
  }

  /* kreslení */
  function rr(x,y,w,hh,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,hh,r):ctx.rect(x,y,w,hh); }
  function leaf(x,y,s,rot,col){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle=col||RED; ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?s*.42:s*(i===0?1.1:.95); ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
    ctx.closePath(); ctx.fill(); ctx.strokeStyle=col||RED; ctx.lineWidth=Math.max(1,s*.12); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,s*1.1); ctx.stroke(); ctx.restore();
  }
  function ridge(f, base, amp, col, seed){
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,G);
    for(let x=0;x<=W+8;x+=8){ const u=(x+dist*f)/W; ctx.lineTo(x, base - amp*(.55+.3*Math.sin(u*2.1+seed)+.15*Math.sin(u*5.3+seed*2))); }
    ctx.lineTo(W,G); ctx.closePath(); ctx.fill();
  }
  /* statické pozadí: papír, rozstříknuté slunce, strom, mlha (kreslí se jednou) */
  function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function blob(c,x,y,r,R,n){ const pts=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, rad=r*(.78+R()*.44); pts.push([x+Math.cos(a)*rad,y+Math.sin(a)*rad]); }
    c.beginPath(); const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2]; let s0=m(pts[n-1],pts[0]); c.moveTo(s0[0],s0[1]);
    for(let i=0;i<n;i++){ const q=pts[i], e=m(pts[i],pts[(i+1)%n]); c.quadraticCurveTo(q[0],q[1],e[0],e[1]); } c.closePath(); c.fill(); }
  function chaikin(pts,k){ for(let it=0;it<k;it++){ const o=[pts[0]]; for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]); } o.push(pts[pts.length-1]); pts=o; } return pts; }
  function splat(c,x,y,r,R,col,drops){
    c.fillStyle=col; blob(c,x,y,r,R,14);
    for(let i=0;i<drops;i++){ const a=R()*Math.PI*2, d=r*(1+R()*1.8), dr=Math.max(.6,r*(.04+R()*.18)*(1.6-d/(r*2.8)));
      c.beginPath(); c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,dr,0,7); c.fill(); }
  }
  function stroke(c,pts,w0,w1){ pts=chaikin(pts,3); for(let i=1;i<pts.length;i++){ c.lineWidth=w0+(w1-w0)*i/pts.length; c.beginPath(); c.moveTo(pts[i-1][0],pts[i-1][1]); c.lineTo(pts[i][0],pts[i][1]); c.stroke(); } }
  function branch(c,R,x,y,ang,len,w,depth,leafs){
    const pts=[[x,y]]; let cx=x, cy=y, a=ang;
    for(let i=0;i<8;i++){ a+= (R()-.5)*.35; cx+=Math.cos(a)*len/8; cy+=Math.sin(a)*len/8; pts.push([cx,cy]); }
    c.strokeStyle=INK; c.lineCap='round'; stroke(c,pts,w,w*.55);
    if(depth<=0||w<1.2){ leafs.push([cx,cy]); return; }
    const k=1+Math.floor(R()*2.5);
    for(let i=0;i<k;i++) branch(c,R,cx,cy,a+(R()-.5)*1.4-(.15),len*(.55+R()*.25),w*.62,depth-1,leafs);
    if(R()<.5) leafs.push([cx,cy]);
  }
  function buildBG(){
    const d=Math.min(window.devicePixelRatio||1,2);
    bgC=document.createElement('canvas'); bgC.width=W*d; bgC.height=H*d; const c=bgC.getContext('2d'); c.scale(d,d);
    const R=rng(7);
    c.fillStyle='#f2f0ea'; c.fillRect(0,0,W,H);
    for(let i=0;i<900;i++){ c.fillStyle='rgba(0,0,0,'+(R()*.035)+')'; c.fillRect(R()*W,R()*H,1+R()*2,1+R()*2); }
    // slunce z akvarelových skvrn
    const sx=W*.52, sy=H*.17, sr=Math.min(W*.42,H*.17);
    const reds=['rgba(214,52,40,.28)','rgba(230,70,55,.25)','rgba(190,35,28,.25)','rgba(240,95,80,.22)'];
    for(let i=0;i<70;i++){ const a=R()*Math.PI*2, dd=Math.sqrt(R())*sr*.75; c.fillStyle=reds[i%4]; blob(c,sx+Math.cos(a)*dd,sy+Math.sin(a)*dd,sr*(.25+R()*.35),R,12); }
    for(let i=0;i<8;i++){ const a=R()*Math.PI*2; splat(c,sx+Math.cos(a)*sr*(.9+R()*.4),sy+Math.sin(a)*sr*(.9+R()*.4),sr*(.05+R()*.08),R,'rgba(205,45,35,.85)',18); }
    for(let i=0;i<260;i++){ const a=R()*Math.PI*2, dd=sr*(.85+R()*R()*1.5); c.fillStyle='rgba(205,45,35,'+(.4+R()*.6)+')';
      c.beginPath(); c.arc(sx+Math.cos(a)*dd,sy+Math.sin(a)*dd,.6+R()*R()*sr*.05,0,7); c.fill(); }
    // šedá mlha / kouř vlevo
    for(let i=0;i<40;i++){ c.fillStyle='rgba(60,60,60,'+(.03+R()*.05)+')'; blob(c,W*(.02+R()*.35),G-B*(.6+R()*1.3),B*(.25+R()*.4),R,10); }
    // strom
    const leafs=[]; const tx=W*.82;
    c.fillStyle=INK; c.strokeStyle=INK;
    const trunk=[[tx+B*.2,G+B*.05],[tx+B*.08,G-B*.7],[tx+B*.18,G-B*1.3],[tx,G-B*1.9],[tx+B*.04,G-B*2.5],[tx-B*.2,sy+sr*.6]];
    c.lineCap='round'; stroke(c,trunk,B*.2,B*.07);
    const top=trunk[trunk.length-1];
    branch(c,R,top[0],top[1],-2.6,sr*1.1,B*.09,4,leafs);
    branch(c,R,top[0],top[1],-1.9,sr*.7,B*.07,3,leafs);
    branch(c,R,trunk[3][0],trunk[3][1],-.4,B*.9,B*.06,2,leafs);
    for(const [x,y] of leafs){ for(let k=0;k<5;k++){ c.fillStyle='rgba(21,21,21,'+(.55+R()*.45)+')'; blob(c,x+(R()-.5)*B*.5,y+(R()-.5)*B*.35,B*(.04+R()*.08),R,8); } }
    // tenké větvičky vlevo
    c.lineWidth=1.5; for(let i=0;i<5;i++){ const y0=sy+sr*(.6+R()*.5); c.beginPath(); c.moveTo(0,y0); let x=0,y=y0; for(let k=0;k<6;k++){ x+=B*(.15+R()*.2); y+=(R()-.6)*B*.15; c.lineTo(x,y);} c.stroke(); }
    // pás pro zem (dlaždice, bezešvě opakovaná)
    const tw=Math.ceil(W*1.5), th=Math.ceil(H-G+2);
    grC=document.createElement('canvas'); grC.width=tw*d; grC.height=th*d; const g=grC.getContext('2d'); g.scale(d,d);
    const R2=rng(11);
    const wrap=(fn)=>{ for(const o of [-tw,0,tw]) fn(o); };
    g.fillStyle='#f2f0ea'; g.fillRect(0,0,tw,th);
    // černý břeh s roztřepeným okrajem
    for(let i=0;i<60;i++){ const x=R2()*tw, w=B*(.4+R2()*1.6), y=R2()*B*.08, hh=B*(.12+R2()*.25);
      wrap(o=>{ g.fillStyle='rgba(21,21,21,'+(.75+R2()*.25)+')'; g.beginPath(); g.ellipse(x+o,y+hh/2,w/2,hh/2,0,0,7); g.fill(); }); }
    g.fillStyle=INK; g.fillRect(0,0,tw,B*.12);
    // červené tahy štětcem
    for(let i=0;i<7;i++){ const x=R2()*tw, w=B*(.8+R2()*2.2), y=B*(.0+R2()*.15);
      wrap(o=>{ g.fillStyle='rgba(205,40,30,'+(.7+R2()*.3)+')'; g.beginPath(); g.moveTo(x+o,y); g.quadraticCurveTo(x+o+w*.5,y-B*.05,x+o+w,y+B*.02); g.lineTo(x+o+w*.9,y+B*.06); g.quadraticCurveTo(x+o+w*.4,y+B*.04,x+o+B*.05,y+B*.07); g.closePath(); g.fill(); }); }
    // odraz ve vodě
    for(let i=0;i<90;i++){ const x=R2()*tw, y=B*.3+R2()*(th-B*.3), w=B*(.2+R2()*1.2), col=R2()<.15?'rgba(205,40,30,.35)':'rgba(21,21,21,'+(.08+R2()*.25)+')';
      wrap(o=>{ g.fillStyle=col; g.fillRect(x+o,y,w,1+R2()*B*.04); }); }
    for(let i=0;i<40;i++){ const x=R2()*tw, hh=B*(.2+R2()*.9);
      wrap(o=>{ g.fillStyle='rgba(21,21,21,'+(.2+R2()*.5)+')'; g.fillRect(x+o,B*.15,1+R2()*B*.05,hh); }); }
    birds=Array.from({length:9},()=>({x:sx+(R()-.2)*sr*1.6, y:sy-sr*(.2+R()*.9), s:B*(.06+R()*.06), p:R()*6}));
  }
  function draw(t){
    if(!bgC) buildBG();
    ctx.drawImage(bgC,0,0,W,H);
    // ptáci
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.lineCap='round';
    for(const b of birds){ const x=((b.x - T*S*.15) % (W+40) + W+40) % (W+40) - 20, f=Math.sin(t/160+b.p)*b.s*.5;
      ctx.beginPath(); ctx.moveTo(x-b.s,b.y-f); ctx.quadraticCurveTo(x-b.s*.4,b.y-b.s*.2,x,b.y); ctx.quadraticCurveTo(x+b.s*.4,b.y-b.s*.2,x+b.s,b.y-f); ctx.stroke(); }
    // zem: posuvná dlaždice
    const tw=grC.width/(grC.height/(H-G+2)), off=dist%tw;
    ctx.drawImage(grC,-off,G-B*.02,tw,H-G+2); ctx.drawImage(grC,tw-off,G-B*.02,tw,H-G+2);
    drawKid(t);
    drawGrass(t);
    for(const o of obs) drawObs(o,t);
    for(const l of leaves) leaf(l.x,l.y,l.s,l.r);
    if(bubble && performance.now()<bubble.until) drawBubble(bubble.t);
  }
  function eyes(cx,cy,r,angry){
    for(const sx of [-1,1]){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+sx*r*1.25,cy,r,0,7); ctx.fill();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(cx+sx*r*1.25-r*.3,cy+r*.15,r*.48,0,7); ctx.fill();
      if(angry){ ctx.strokeStyle=INK; ctx.lineWidth=r*.45; ctx.beginPath(); ctx.moveTo(cx+sx*r*.4,cy-r*.9); ctx.lineTo(cx+sx*r*2.1,cy-r*1.5); ctx.stroke(); } }
  }
  function drawObs(o,t){
    const Q=S*.5;
    const cy = o.fly ? o.y : G-o.lift-o.h/2;
    ctx.save(); ctx.translate(o.x,cy); if(o.fly) ctx.rotate(o.rot);
    const w=o.w, hh=o.h;
    if(o.k==='case'){
      ctx.fillStyle=INK; ctx.strokeStyle=INK; ctx.lineWidth=Q*.04;
      rr(-w/2,-hh/2,w,hh,Q*.08); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-w*.2,-hh/2); ctx.lineTo(-w*.2,-hh/2-Q*.12); ctx.lineTo(w*.2,-hh/2-Q*.12); ctx.lineTo(w*.2,-hh/2); ctx.stroke();
      ctx.strokeStyle='#f2f0ea'; ctx.lineWidth=Q*.02; for(const sx of [-.25,.25]){ ctx.beginPath(); ctx.moveTo(w*sx,-hh/2); ctx.lineTo(w*sx,hh/2); ctx.stroke(); }
      ctx.fillStyle=RED; ctx.beginPath(); ctx.moveTo(w*.3,-hh*.2); ctx.lineTo(w*.48,-hh*.05); ctx.lineTo(w*.38,hh*.18); ctx.lineTo(w*.22,0); ctx.closePath(); ctx.fill();
    } else if(o.k==='poop'){
      ctx.fillStyle=INK; ctx.strokeStyle='#f2f0ea'; ctx.lineWidth=Q*.02;
      const seg=[[0,hh*.3,w*.5,hh*.2],[0,hh*.05,w*.38,hh*.18],[0,-hh*.17,w*.26,hh*.15]];
      for(const [x,y,rx,ry] of seg){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-w*.1,-hh*.27); ctx.quadraticCurveTo(w*.05,-hh*.55,w*.08,-hh*.42); ctx.quadraticCurveTo(w*.12,-hh*.3,w*.1,-hh*.27); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-w*.18,hh*.24,w*.08,hh*.05,-.4,0,7); ctx.fill();
      ctx.strokeStyle='rgba(21,21,21,.45)'; ctx.lineWidth=Q*.02;
      for(const sx of [-.25,.05,.32]){ ctx.beginPath(); for(let k=0;k<=8;k++){ const yy=-hh*.55-k*Q*.04; ctx.lineTo(w*sx+Math.sin(k+t/150)*Q*.03, yy); } ctx.stroke(); }
      const fa=t/180; ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(Math.cos(fa)*w*.45,-hh*.6+Math.sin(fa*1.7)*hh*.2,Q*.025,0,7); ctx.fill();
    } else if(o.k==='blob'){
      const bob=o.fly?0:Math.sin(t/120+o.ph)*Q*.03;
      ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,bob,w/2,hh/2,0,Math.PI,0); ctx.lineTo(w/2,hh/2); ctx.lineTo(-w/2,hh/2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-w*.28,-hh*.32+bob); ctx.lineTo(-w*.4,-hh*.8+bob); ctx.lineTo(-w*.12,-hh*.45+bob); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w*.28,-hh*.32+bob); ctx.lineTo(w*.4,-hh*.8+bob); ctx.lineTo(w*.12,-hh*.45+bob); ctx.fill();
      eyes(0,-hh*.05+bob,w*.11,false);
      ctx.fillStyle=RED; ctx.beginPath(); ctx.arc(-w*.32,hh*.12+bob,w*.06,0,7); ctx.arc(w*.32,hh*.12+bob,w*.06,0,7); ctx.fill();
      ctx.fillStyle='#fff'; for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(k*w*.07-w*.03,hh*.2+bob); ctx.lineTo(k*w*.07,hh*.3+bob); ctx.lineTo(k*w*.07+w*.03,hh*.2+bob); ctx.fill(); }
      ctx.fillStyle=INK; const st=Math.sin(t/80+o.ph)*Q*.04; ctx.fillRect(-w*.3,hh/2,w*.14,Q*.05+st); ctx.fillRect(w*.16,hh/2,w*.14,Q*.05-st);
    } else if(o.k==='ball'){
      const r=w/2; ctx.save(); if(!o.fly) ctx.rotate(-dist/(r)*.5);
      ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=Q*.035; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      ctx.save(); ctx.clip(); ctx.fillStyle=INK;
      const pent=(cx,cy,pr,rot)=>{ ctx.beginPath(); for(let k=0;k<5;k++){ const a=rot+k*Math.PI*2/5; ctx.lineTo(cx+Math.cos(a)*pr,cy+Math.sin(a)*pr);} ctx.closePath(); ctx.fill(); };
      pent(0,0,r*.32,-Math.PI/2); for(let k=0;k<5;k++){ const a=Math.PI/2+k*Math.PI*2/5; pent(Math.cos(a)*r*1.0,Math.sin(a)*r*1.0,r*.3,a); }
      ctx.restore(); ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); ctx.restore();
      if(!o.fly && o.lift<Q*.05){ ctx.fillStyle='rgba(21,21,21,.25)'; }
    } else drawExtra(o,Q,t,w,hh);
    ctx.restore();
  }

  function drawExtra(o,Q,t,w,hh){
    const b=hh/2, ln=Math.max(2,Q*.04);
    ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=INK; ctx.lineWidth=ln;
    const eye=(x,y,r)=>{ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(x,y,r*.5,0,7); ctx.fill(); };
    if(o.k==='tnt'){
      ctx.fillStyle='#d3261b'; rr(-w/2,-b,w,hh,Q*.05); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f2f0ea'; ctx.fillRect(-w/2,-hh*.17,w,hh*.34); ctx.strokeRect(-w/2,-hh*.17,w,hh*.34);
      ctx.fillStyle=INK; ctx.font='800 '+Math.round(hh*.28)+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('TNT',0,0);
      ctx.beginPath(); ctx.moveTo(0,-b); ctx.quadraticCurveTo(w*.1,-b-hh*.25,w*.25,-b-hh*.2); ctx.stroke();
      ctx.fillStyle='#f5a623'; ctx.beginPath(); ctx.arc(w*.25,-b-hh*.2,Q*.07+Math.sin(t/60)*Q*.02,0,7); ctx.fill();
    } else if(o.k==='sushi'){
      ctx.fillStyle='#f2f0ea'; rr(-w/2,-hh*.1,w,hh*.6,hh*.25); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ee6a3c'; ctx.beginPath(); ctx.moveTo(-w*.55,-hh*.05); ctx.quadraticCurveTo(0,-hh*.75,w*.55,-hh*.05); ctx.quadraticCurveTo(0,hh*.2,-w*.55,-hh*.05); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#f6c9b0'; ctx.lineWidth=ln*.7; for(const x of [-.25,0,.25]){ ctx.beginPath(); ctx.moveTo(w*x-w*.07,-hh*.25); ctx.quadraticCurveTo(w*x,-hh*.05,w*x+w*.07,-hh*.3); ctx.stroke(); }
      ctx.strokeStyle=INK; ctx.lineWidth=ln;
    } else if(o.k==='buddha'){
      ctx.fillStyle='#b98a3e'; ctx.beginPath(); ctx.ellipse(0,b-hh*.12,w*.55,hh*.13,0,0,7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-w*.4,b-hh*.12); ctx.quadraticCurveTo(-w*.45,-hh*.1,-w*.15,-hh*.15); ctx.lineTo(w*.15,-hh*.15); ctx.quadraticCurveTo(w*.45,-hh*.1,w*.4,b-hh*.12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-hh*.3,w*.2,0,7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-hh*.5,w*.07,0,7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=INK; ctx.beginPath(); ctx.arc(-w*.07,-hh*.3,w*.03,.1*Math.PI,.9*Math.PI); ctx.arc(w*.07,-hh*.3,w*.03,.1*Math.PI,.9*Math.PI); ctx.stroke();
    } else if(o.k==='apple'){
      ctx.fillStyle='#d3261b'; ctx.beginPath(); ctx.moveTo(0,-b+hh*.2);
      ctx.bezierCurveTo(w*.7,-b-hh*.05,w*.6,b,0,b); ctx.bezierCurveTo(-w*.6,b,-w*.7,-b-hh*.05,0,-b+hh*.2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=INK; ctx.beginPath(); ctx.moveTo(0,-b+hh*.2); ctx.quadraticCurveTo(w*.05,-b,w*.12,-b-hh*.06); ctx.stroke();
      ctx.fillStyle='#3a9b47'; ctx.beginPath(); ctx.ellipse(w*.22,-b+hh*.02,w*.18,hh*.07,-.5,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f6d9c0'; ctx.beginPath(); ctx.arc(-w*.05,hh*.05,hh*.07,0,7); ctx.fill(); // červík vykukuje
      eye(-w*.05,hh*.03,hh*.04);
    } else if(o.k==='bowl'){
      ctx.fillStyle='#f2f0ea'; ctx.beginPath(); ctx.moveTo(-w/2,-hh*.1); ctx.lineTo(w/2,-hh*.1); ctx.quadraticCurveTo(w*.45,b,0,b); ctx.quadraticCurveTo(-w*.45,b,-w/2,-hh*.1); ctx.closePath(); ctx.fill(); ctx.stroke();
      const cols=['#ee6a3c','#3a9b47','#f2b705','#d3261b','#7a4bb0'];
      cols.forEach((c,i)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(-w*.36+i*w*.18,-hh*.18,w*.1,Math.PI,0); ctx.fill(); ctx.stroke(); });
      ctx.fillStyle='#f4efe3'; ctx.beginPath(); ctx.ellipse(0,-hh*.3,w*.2,hh*.14,0,0,7); ctx.fill(); ctx.stroke();
    } else if(o.k==='oni'){
      ctx.fillStyle='#c8281e'; ctx.beginPath(); ctx.ellipse(0,hh*.05,w*.5,hh*.45,0,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f2f0ea'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*w*.2,-hh*.35); ctx.lineTo(sx*w*.34,-hh*.7); ctx.lineTo(sx*w*.38,-hh*.3); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      for(const sx of [-1,1]){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx*w*.2,-hh*.05,w*.1,0,7); ctx.fill(); ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(sx*w*.2,-hh*.03,w*.045,0,7); ctx.fill(); ctx.lineWidth=ln*1.4; ctx.beginPath(); ctx.moveTo(sx*w*.05,-hh*.22); ctx.lineTo(sx*w*.32,-hh*.12); ctx.stroke(); ctx.lineWidth=ln; }
      ctx.fillStyle=INK; rr(-w*.25,hh*.15,w*.5,hh*.2,w*.05); ctx.fill();
      ctx.fillStyle='#fff'; for(const sx of [-.15,.15]){ ctx.beginPath(); ctx.moveTo(w*sx-w*.04,hh*.15); ctx.lineTo(w*sx,hh*.28); ctx.lineTo(w*sx+w*.04,hh*.15); ctx.fill(); }
    } else if(o.k==='chomp'){
      const r=w/2; ctx.fillStyle='#f5d312'; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.stroke();
      eye(-r*.35,-r*.25,r*.2); eye(r*.2,-r*.25,r*.2);
      ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,r*.35,r*.45,r*.22,0,0,Math.PI); ctx.fill();
      ctx.fillStyle='#fff'; for(const x of [-.25,-.05,.15,.35]){ ctx.beginPath(); ctx.moveTo(r*x-r*.07,r*.35); ctx.lineTo(r*x,r*.46); ctx.lineTo(r*x+r*.07,r*.35); ctx.fill(); }
    } else if(o.k==='robot'){
      ctx.fillStyle='#9aa0a6'; rr(-w*.45,-hh*.3,w*.9,hh*.65,Q*.08); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#c9cdd2'; rr(-w*.32,-hh*.48,w*.64,hh*.26,Q*.06); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-hh*.48); ctx.lineTo(0,-hh*.62); ctx.stroke(); ctx.fillStyle='#d3261b'; ctx.beginPath(); ctx.arc(0,-hh*.64,Q*.06,0,7); ctx.fill();
      eye(-w*.14,-hh*.36,hh*.06); eye(w*.14,-hh*.36,hh*.06);
      ctx.fillStyle=INK; ctx.fillRect(-w*.25,hh*.02,w*.5,hh*.1);
      ctx.fillRect(-w*.3,b-hh*.12,w*.2,hh*.12); ctx.fillRect(w*.1,b-hh*.12,w*.2,hh*.12);
    }
  }
  function drawKid(t){
    const x=px(), hh=S*.62, ww=hh*SAM.w, bob=P.air?0:Math.sin(t/350)*S*.012;
    const y=P.y+S*.04+bob;
    if(SAM.img.complete && SAM.img.naturalWidth){
      ctx.save(); if(P.air) { ctx.translate(x,y-hh/2); ctx.rotate(-.06); ctx.translate(-x,-(y-hh/2)); }
      ctx.drawImage(SAM.img, x-ww*.45, y-hh, ww, hh); ctx.restore();
    }
    if(P.kick>0){ ctx.strokeStyle=RED; ctx.lineWidth=S*.025; ctx.lineCap='round'; ctx.globalAlpha=Math.max(0,P.kick/.35);
      ctx.beginPath(); ctx.arc(x+S*.18,y-hh*.45,S*.22,-1.1,.9); ctx.stroke(); ctx.globalAlpha=1; }
  }
  /* červená tráva v popředí, kývá se ve větru */
  function drawGrass(t){
    const rows=Math.ceil((H-G)/(S*.07))+1, sp=Math.max(3,W/110);
    const gust=Math.sin(t/1700)*.6+Math.sin(t/650)*.25;
    for(let r=0;r<rows;r++){
      const base=G+S*.04+r*S*.07, hmax=S*(r===0?.22:.16+r*.02), f=1+r*.15, off=(dist*f)%(sp*97);
      const i0=Math.floor(dist*f/sp);
      for(let k=-2, x=-(dist*f%sp); x<W+sp*2; k++, x+=sp){
        const n=Math.abs(Math.sin((i0+k)*12.9898+r*78.233)*43758.5453)%1, n2=Math.abs(Math.sin((i0+k)*4.1414+r*9.1)*1531.7)%1;
        const hgt=hmax*(r===0?(.45+.55*n):(.35+.65*n*n2+.2*n)), bend=(gust+Math.sin(t/480+(i0+k)*.37+r)*.35)*hgt*.35;
        ctx.fillStyle = n2<.33?'#9e1d16':n2<.7?'#c8281e':'#e5392a';
        const bx=x+n*sp, w=Math.max(1,sp*.45);
        ctx.beginPath(); ctx.moveTo(bx-w,base); ctx.quadraticCurveTo(bx+bend*.3,base-hgt*.6,bx+bend,base-hgt); ctx.quadraticCurveTo(bx+bend*.3+w*.3,base-hgt*.55,bx+w,base); ctx.closePath(); ctx.fill();
        if(r===0 && n>.82){ ctx.globalAlpha=.55; ctx.beginPath(); ctx.ellipse(bx+bend,base-hgt,sp*.9,hgt*.18,-.3+bend/hgt,0,7); ctx.fill(); ctx.globalAlpha=1; }
      }
      if(r>0){ ctx.fillStyle='#b5231a'; ctx.fillRect(0,base,W,S*.075); }
    }
  }
  function drawBubble(txt){
    ctx.save();
    ctx.font=Math.round(Math.min(S*.13,W*.075))+'px "Dela Gothic One","Bricolage Grotesque",system-ui,sans-serif';
    const fs=Math.min(S*.13,W*.075), tw=ctx.measureText(txt).width, bw=tw+fs*1.6, bh=fs*2, bx=Math.max(10,Math.min(px()+S*.1, W-bw-10)), by=Math.max(70,P.y-S*.9);
    ctx.translate(bx+bw/2,by+bh/2); ctx.rotate(-.05);
    ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=4;
    rr(-bw/2,-bh/2,bw,bh,bh*.45); ctx.fill(); ctx.stroke();
    const tx0=px()-(bx+bw/2);
    ctx.beginPath(); ctx.moveTo(tx0+fs*.4,bh/2-2); ctx.lineTo(tx0,bh/2+fs*1.1); ctx.lineTo(tx0+fs*1.3,bh/2-2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx0+fs*.4,bh/2); ctx.lineTo(tx0,bh/2+fs*1.1); ctx.lineTo(tx0+fs*1.3,bh/2); ctx.stroke();
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,2);
    ctx.restore();
  }
  function loop(t){
    if(!alive) return;
    const dt = Math.min(.033, last? (t-last)/1000 : 0); last=t;
    if(!paused) update(dt);
    draw(t); raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);

  /* otázky */
  function ask(){
    if(paused) return; paused=true;
    const q=ex.qs[qi]; let first=true;
    const opts=shuffle(q.o.map((t,i)=>({t,i})));
    const btns=opts.map(o=>{ const b=h('button',{class:'opt',onclick:()=>{
      if(o.i===q.a){ b.classList.add('good'); btns.forEach(x=>x.disabled=true); say(o.t,'en-US'); if(first) firstTry++;
        setTimeout(()=>{ ov.remove(); qi++; passed=0; cnt.textContent='○○○';
          if(qi>=ex.qs.length) return end(); qLbl.textContent='Otázka '+(qi+1)+'/'+ex.qs.length; last=0; paused=false; },700);
      } else { first=false; b.classList.add('bad','shake'); b.disabled=true; }
    }},o.t); return b; });
    const ov=h('div',{class:'ov'},h('div',{class:'card scroll-card'},
      h('span',{class:'eyebrow'},'Otázka '+(qi+1)+' / '+ex.qs.length),
      h('p',{class:'q'},q.q), h('div',{class:'opts'},btns)));
    stage.append(ov);
  }
  function end(){
    const e=ex.end||{};
    const ov=h('div',{class:'ov'},h('div',{class:'card scroll-card'},
      h('span',{class:'eyebrow'},'Správně napoprvé: '+firstTry+' / '+ex.qs.length),
      h('h1',{},e.title||'Hotovo!'),
      e.text?h('p',{},e.text):null,
      e.sign?h('button',{class:'sign',onclick:()=>say(e.sign,'ja-JP'),'aria-label':'Přehrát výslovnost'},
        h('i',{class:'pict','aria-hidden':'true'}),
        h('div',{},h('b',{},e.sign),h('span',{},e.sr||''))):null,
      e.more?h('p',{class:'note'},e.more):null,
      h('button',{class:'btn primary',onclick:()=>{ stop(); onDone(firstTry); }},'Pokračovat')));
    stage.append(ov);
    const pic=ov.querySelector('.pict'); if(pic) pic.innerHTML='<svg viewBox="0 0 64 64" width="56" height="56" fill="currentColor" style="color:var(--accent)"><circle cx="18" cy="12" r="6"/><path d="M11 22h14l-2 18h-3v18h-4V40h-3z"/><circle cx="46" cy="12" r="6"/><path d="M40 22h12l7 24h-6l-1 12h-10l-1-12h-6z"/><rect x="31" y="6" width="2" height="54"/></svg>';
  }
}
async function finish(){
  const l=run.l, total=l.exercises.reduce((t,e)=>t+(e.t==='run'?e.qs.length:1),0), correct=run.correct;
  const row = {kid:state.kid, lesson_id:l.id, score:correct, total, ts:new Date().toISOString()};
  let where='device';
  if(remote.on()){
    try{ await remote.add([row]); state.remote.unshift(row); where='server'; }
    catch(e){ LS.set('dojo.pending',[...pending(),row]); }
  } else { LS.set('dojo.pending',[...pending(),row]); }
  const pct = total?correct/total:0, xp = Math.round((l.xp||30)*pct);
  mount(
    h('span',{class:'eyebrow'},'Hotovo'),
    h('div',{class:'score'},correct+' / '+total),
    h('p',{class:'q',style:'text-align:center'},pct===1?'Bez jediné chyby.':pct>=.7?'Dobrá práce.':'Zkus to ještě jednou, půjde to líp.'),
    h('p',{style:'text-align:center'},'+'+xp+' XP'),
    h('p',{class:'note',style:'text-align:center'},where==='server'?'Výsledek je uložený.':'Výsledek je uložený jen v tomto zařízení a na server se pošle později.'),
    h('div',{class:'row'},h('button',{class:'btn',onclick:()=>startLesson(l)},'Zopakovat'),h('button',{class:'btn primary',onclick:render},'Zpět na přehled'))
  );
}
load();
</script>
